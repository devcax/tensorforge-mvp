name: TensorForge deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tensorforge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ENV
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment settings
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
          PORT: ${{ secrets.PORT }}
          ENV_VAR: ${{ vars.ENV_VAR }}

        run: |
          set -euo pipefail
          for name in TS_AUTHKEY SSH_PRIVATE_KEY SSH_USER SSH_HOST WORK_DIR ENV_VAR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name in GitHub environment ENV or repository settings."
              exit 1
            fi
          done
          if [[ "$WORK_DIR" != /* || "$WORK_DIR" == / ]]; then
            echo "::error::WORK_DIR must be an absolute application directory."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: tensorforge-api:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/tensorforge-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        timeout-minutes: 40
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
          ENV_VAR: ${{ vars.ENV_VAR }}
        run: |
          set -euo pipefail

          ssh_run() {
            local remote_command
            remote_command="$(python3 -c 'import shlex, sys; print(shlex.join(sys.argv[1:]))' "$@")"
            ssh -p "$PORT" -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
              "$SSH_USER@$SSH_HOST" "$remote_command"
          }

          echo "Checking server prerequisites..."
          ssh_run bash -s -- "$WORK_DIR" <<'EOF'
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "An ARM64 Linux server is required." >&2; exit 1 ;;
          esac
          docker info >/dev/null
          docker compose version
          mkdir -p -- "$1"
          EOF

          echo "Transferring Docker image..."
          gzip -c "$RUNNER_TEMP/tensorforge-api.tar" | ssh_run bash -c 'set -euo pipefail; gunzip -c | docker load'

          echo "Updating Docker Compose configuration..."
          ssh_run bash -c 'set -euo pipefail; cat > "$1/docker-compose.yml.new"; mv -- "$1/docker-compose.yml.new" "$1/docker-compose.yml"' \
            -- "$WORK_DIR" < docker-compose.yml

          echo "Writing application environment..."
          printf '%s\n' "$ENV_VAR" | ssh_run bash -c 'set -euo pipefail; umask 077; cat > "$1/.env.new"; chmod 600 "$1/.env.new"; mv -- "$1/.env.new" "$1/.env"' \
            -- "$WORK_DIR"

          echo "Starting API and waiting for model readiness..."
          ssh_run bash -s -- "$WORK_DIR" <<'EOF'
          set -euo pipefail
          cd -- "$1"
          docker compose config --quiet
          if ! docker compose up -d --no-build --pull never --remove-orphans --wait --wait-timeout 1800 api; then
            docker compose ps -a
            docker compose logs --no-color --tail 100 api
            exit 1
          fi
          docker compose ps
          echo "Deployment finished successfully."
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
